name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Build launcher
        shell: ${{ matrix.shell }}
        run: .\scripts\build.ps1
      - name: Run non-destructive regression checks
        shell: ${{ matrix.shell }}
        run: .\scripts\test.ps1
